    slo: 6
  - type: Mix
    count: 1
    qpm: 20
    slo: 7
  - type: Mix
    count: 1
    qpm: 26
    slo: 8
  - type: Mix
    count: 1
    qpm: 30
    slo: 9
  - type: Mix
    count: 1
    qpm: 34
    slo: 10
  - type: Mix
    count: 1
    qpm: 34
    slo: 12

# 总 QPM: 160
