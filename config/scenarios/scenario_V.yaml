# =============================================================================
# Scenario V: 混合压力场景（8客户端）
# =============================================================================
# 模拟：8个客户端，包含大客户、紧急小客户、普通小客户、低优先级客户
# 特点：最复杂的混合场景，测试ExFairS的综合调度能力
# 总 QPM: 300
# =============================================================================

name: "Scenario_V_Mixed_Pressure"
description: "8 clients with mixed requirements - most complex scenario"

# experiment 配置统一在 config/Config.py 中

clients:
  # 大客户组（2个，占53.3%流量）
  - type: Batch
    count: 1
    qpm: 80
    slo: 10
    # 大客户A：高流量，中等SLO
  - type: Batch
    count: 1
    qpm: 80
    slo: 12
    # 大客户B：高流量，宽松SLO
  
  # 紧急小客户组（2个，占20%流量）
  - type: Realtime
    count: 1
    qpm: 30
    slo: 5
    # 紧急小客户A：低流量，最严格SLO
  - type: Realtime
    count: 1
    qpm: 30
    slo: 5
    # 紧急小客户B：低流量，最严格SLO
  
  # 普通小客户组（2个，占16.7%流量）
  - type: Mix
    count: 1
    qpm: 25
    slo: 8
    # 普通小客户A：低流量，中等SLO
  - type: Mix
    count: 1
    qpm: 25
    slo: 8
    # 普通小客户B：低流量，中等SLO
  
  # 低优先级客户组（2个，占10%流量）
  - type: Batch
    count: 1
    qpm: 15
    slo: 15
    # 低优先级A：最低流量，最宽松SLO
  - type: Batch
    count: 1
    qpm: 15
    slo: 15
    # 低优先级B：最低流量，最宽松SLO

# 总 QPM: 80×2 + 30×2 + 25×2 + 15×2 = 300
# 客户端分组:
#   - 大客户组: 53.3% QPM, SLO 10-12s
#   - 紧急小客户组: 20% QPM, SLO 5s
#   - 普通小客户组: 16.7% QPM, SLO 8s
#   - 低优先级组: 10% QPM, SLO 15s
