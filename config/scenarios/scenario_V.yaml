# =============================================================================
# Scenario V: Extreme Heterogeneity（极端异构场景）
# =============================================================================
# 场景特点: 10个用户，只有short和long，无mix，制造极端差异
# SLO设置: 
#   - 短请求: 21s/24s/27s/30s/33s (原14/16/18/20/22 * 1.5)
#   - 长请求: 18s/19s/22s/25s/28s (原12/13/15/17/19 * 1.5)
# 负载: ~70 QPM
# =============================================================================

name: "Scenario_V_Extreme_Heterogeneity"
description: "10 users with only short and long, extreme SLO variance (~70 QPM)"

clients:
  short:
    count: 5
    qpm: [7, 7, 7, 7, 7]        # 均匀分布
    qpm_ratio: 1
    slo: [21, 24, 27, 30, 33]   # 原来 14/16/18/20/22 * 1.5
  
  long:
    count: 5
    qpm: [7, 7, 7, 7, 7]        # 均匀分布
    qpm_ratio: 1
    slo: [18, 19, 22, 25, 28]   # 原来 12/13/15/17/19 * 1.5
  
  mix:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []

# 总QPM: 70 (10个用户 * 7 QPM)
