    count: 1
    qpm: 15
    slo: 6
  - type: Mix
    count: 1
    qpm: 19
    slo: 7
  - type: Mix
    count: 1
    qpm: 24
    slo: 8
  - type: Mix
    count: 1
    qpm: 28
    slo: 9
  - type: Mix
    count: 1
    qpm: 32
    slo: 10
  - type: Mix
    count: 1
    qpm: 32
    slo: 12

# 总 QPM: 150
