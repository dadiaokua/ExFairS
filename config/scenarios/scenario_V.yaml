# =============================================================================
# Scenario V: Extreme Heterogeneity（极端异构场景）
# =============================================================================
# 实验数据: short~17-19s, long~13-15s
# 场景特点: 10个用户，只有short和long，无mix，制造极端差异
# SLO设置: 
#   - 短请求: 有紧有松，制造内部竞争
#   - 长请求: SLO渐变，制造公平性挑战
# 负载: ~100 QPM
# =============================================================================

name: "Scenario_V_Extreme_Heterogeneity"
description: "10 users with only short and long, extreme SLO variance (~100 QPM)"

clients:
  short:
    count: 5
    qpm: [10, 10, 10, 10, 10]   # 均匀分布
    qpm_ratio: 1
    slo: [14, 16, 18, 20, 22]   # 渐变SLO: 紧->中->松
  
  long:
    count: 5
    qpm: [10, 10, 10, 10, 10]   # 均匀分布
    qpm_ratio: 1
    slo: [12, 13, 15, 17, 19]   # 渐变SLO: 紧->中->松
  
  mix:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []

# 总QPM: 100 (10个用户 * 10 QPM)
