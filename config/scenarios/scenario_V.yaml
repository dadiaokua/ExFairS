# =============================================================================
# Scenario V: 4 Clients - QPM动态浮动，SLO两极分化
# =============================================================================
# 客户端: 4 Mix
# QPM: 30, 38, 42, 46 (基础值，总156)
# QPM 浮动: ±30% (random 模式)
# SLO: 5s, 5s, 8s, 8s (两极分化：紧张 vs 宽松)
# 总 QPM: 156 (基础)
# =============================================================================

name: "Scenario_V_4Clients_DynamicQPM_PolarizedSLO"
description: "4 Clients with dynamic QPM (±30%), polarized SLO (5s tight vs 8s relaxed)"

# 覆盖基础配置
experiment:
  request_timeout: 15
  max_output_tokens: 128

# QPM 动态浮动配置
qpm_variation: 0.3           # ±30% 浮动
qpm_pattern: "random"        # 随机浮动模式
max_total_qpm: 220           # 总 QPM 上限 (156 * 1.3 ≈ 203，留点余量)

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 30
    slo: 5       # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 38
    slo: 5       # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 42
    slo: 8       # 宽松 SLO
  - type: Mix
    count: 1
    qpm: 46
    slo: 8       # 宽松 SLO

# 基础总 QPM: 156
# 实际 QPM 会在 109-203 之间浮动 (156 * 0.7 ~ 156 * 1.3)
# SLO 两极分化: 2个紧张(5s), 2个宽松(8s)
