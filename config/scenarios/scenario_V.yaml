# =============================================================================
# Scenario V: 混合场景 - 最接近真实生产环境
# =============================================================================
# 模拟：多种类型客户端共存
# - 1个大批量客户（数据处理管道）
# - 2个中等交互式客户（Web应用）
# - 1个小型实时客户（聊天机器人）
# 总 QPM: 350 (原320 + 30)
# =============================================================================

name: "Scenario_V_Production_Mix"
description: "Production-like mix: batch + interactive + realtime clients"

experiment:
  request_timeout: 20
  max_output_tokens: 128

clients:
  # 批量处理：高QPM，非常宽松SLO
  - type: Mix
    count: 1
    qpm: 160       # (原140+20)
    slo: 20        # 非常宽松
  # 交互式Web应用：中等QPM，中等SLO
  - type: Mix
    count: 1
    qpm: 75        # (原70+5)
    slo: 8
  - type: Mix
    count: 1
    qpm: 65        # (原60+5)
    slo: 8
  # 实时聊天：低QPM，紧张SLO
  - type: Mix
    count: 1
    qpm: 50        # (原50)
    slo: 5.5       # 紧张

# QPM 比例: 3.2 : 1.5 : 1.3 : 1
# SLO 比例: 3.6 : 1.5 : 1.5 : 1
# 挑战：综合考验所有调度能力
