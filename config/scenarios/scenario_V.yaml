# =============================================================================
# Scenario V: Mixed Heterogeneous (6 Mix)
# =============================================================================
# 配置: Mix 6 Clients
# 描述: QPM 和 SLO 都有差异（综合场景）
# 特点: 低QPM配紧SLO，高QPM配松SLO（最能体现ExFairS优势）
# 客户端: 6 Mix
# QPM: 8, 8, 12, 12, 16, 16 (2倍差异)
# SLO: 10, 16, 10, 16, 10, 16 (1.6倍差异，稍微宽松)
# 总 QPM: 72
# =============================================================================

name: "Scenario_V_Mixed_Heterogeneous_6Mix"
description: "Mixed heterogeneous workload with QPM and SLO variance"

clients:
  short:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []
  
  long:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []
  
  mix:
    count: 6
    qpm: [8, 8, 12, 12, 16, 16]
    qpm_ratio: 1
    slo: [10, 16, 10, 16, 10, 16]

# 总QPM: 72
