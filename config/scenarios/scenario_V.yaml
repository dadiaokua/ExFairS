# =============================================================================
# Scenario V: 4 Clients - QPM动态浮动，SLO两极分化
# =============================================================================
# 客户端: 4 Mix
# QPM: 15, 20, 22, 23 (基础值，与Scenario I相同)
# QPM 浮动: ±30% (random 模式)
# SLO: 16s, 16s, 20s, 20s (两极分化：紧张 vs 宽松)
# 总 QPM: 80 (基础)
# =============================================================================

name: "Scenario_V_4Clients_DynamicQPM_PolarizedSLO"
description: "4 Clients with dynamic QPM (±30%), polarized SLO (16s tight vs 20s relaxed)"

# 覆盖基础配置
experiment:
  request_timeout: 25
  max_output_tokens: 512

# QPM 动态浮动配置
qpm_variation: 0.3           # ±30% 浮动
qpm_pattern: "random"        # 随机浮动模式
max_total_qpm: 120           # 总 QPM 上限

# 客户端配置 - QPM基础值与Scenario I完全一致
clients:
  - type: Mix
    count: 1
    qpm: 15
    slo: 16      # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 20
    slo: 16      # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 22
    slo: 20      # 宽松 SLO
  - type: Mix
    count: 1
    qpm: 23
    slo: 20      # 宽松 SLO

# 基础总 QPM: 80 (与Scenario I相同)
# 实际 QPM 会在 56-104 之间浮动 (80 * 0.7 ~ 80 * 1.3)
# 但受 max_total_qpm=120 限制
# SLO 两极分化: 2个紧张(16s), 2个宽松(20s)
# 测试 ExFairS 在动态负载 + SLO 差异明显时的公平性调度能力
