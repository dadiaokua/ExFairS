# =============================================================================
# Scenario V: 4 Clients - QPM动态浮动，SLO两极分化
# =============================================================================
# 客户端: 4 Mix
# QPM: 50, 60, 65, 75 (基础值，总250)
# QPM 浮动: ±30% (random 模式)
# SLO: 5s, 5s, 8s, 8s (两极分化：紧张 vs 宽松)
# 总 QPM: 250 (基础)
# =============================================================================

name: "Scenario_V_4Clients_DynamicQPM_PolarizedSLO"
description: "4 Clients with dynamic QPM (±30%), polarized SLO (5s tight vs 8s relaxed)"

# 覆盖基础配置
experiment:
  request_timeout: 15
  max_output_tokens: 128

# QPM 动态浮动配置
qpm_variation: 0.3           # ±30% 浮动
qpm_pattern: "random"        # 随机浮动模式
max_total_qpm: 350           # 总 QPM 上限 (250 * 1.3 ≈ 325，留点余量)

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 50
    slo: 5       # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 60
    slo: 5       # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 65
    slo: 8       # 宽松 SLO
  - type: Mix
    count: 1
    qpm: 75
    slo: 8       # 宽松 SLO

# 基础总 QPM: 250
# 实际 QPM 会在 175-325 之间浮动 (250 * 0.7 ~ 250 * 1.3)
# SLO 两极分化: 2个紧张(5s), 2个宽松(8s)
