# =============================================================================
# Scenario V: Extreme Heterogeneity（极端异构场景）
# =============================================================================
# 场景特点: 10个用户，只有short和long，无mix，制造极端差异
# SLO设置: 
#   - 短请求: 17s/19s/22s/24s/26s (原14/16/18/20/22 * 1.2)
#   - 长请求: 14s/16s/18s/20s/23s (原12/13/15/17/19 * 1.2)
# 负载: ~70 QPM
# =============================================================================

name: "Scenario_V_Extreme_Heterogeneity"
description: "10 users with only short and long, extreme SLO variance (~70 QPM)"

clients:
  short:
    count: 5
    qpm: [7, 7, 7, 7, 7]
    qpm_ratio: 1
    slo: [17, 19, 22, 24, 26]   # 原来 14/16/18/20/22 * 1.2
  
  long:
    count: 5
    qpm: [7, 7, 7, 7, 7]
    qpm_ratio: 1
    slo: [14, 16, 18, 20, 23]   # 原来 12/13/15/17/19 * 1.2
  
  mix:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []

# 总QPM: 70
