# =============================================================================
# Scenario V: High Concurrency (20 Mix, Varied QPM)
# =============================================================================
# 配置: Mix 20 Clients (QPM=2-5)
# 描述: High Concurrency
# 客户端: 20 Mix
# QPM: 2, 3, 4, 5 (原比例 5:7:8:10 缩放)
# SLO: 5, 8, 10, 12, 15, 20
# 总 QPM: 70
# =============================================================================

name: "Scenario_V_High_Concurrency_20Mix"
description: "High Concurrency with 20 Mix clients, varied QPM"

clients:
  short:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []
  
  long:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []
  
  mix:
    count: 20
    qpm: [2, 3, 4, 5, 2, 3, 4, 5, 2, 3, 4, 5, 2, 3, 4, 5, 2, 3, 4, 5]
    qpm_ratio: 1
    slo: [5, 8, 10, 12, 15, 20, 5, 8, 10, 12, 15, 20, 5, 8, 10, 12, 15, 20, 5, 8]

# 总QPM: 70 (2+3+4+5)*5 = 14*5 = 70
