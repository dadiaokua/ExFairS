# =============================================================================
# Scenario I: 双客户端对比
# =============================================================================
# 模拟：2个客户端，相同QPM但不同SLO
# 特点：测试ExFairS在SLO差异场景下的表现
# 总 QPM: 300
# =============================================================================

name: "Scenario_I_Dual_Client"
description: "2 clients with same QPM but different SLO requirements"

# experiment 配置统一在 config/Config.py 中

clients:
  - type: Realtime
    count: 1
    qpm: 150
    slo: 7
    # 严格SLO客户端
  - type: Batch
    count: 1
    qpm: 150
    slo: 12
    # 宽松SLO客户端

# 总 QPM: 150 × 2 = 300
# QPM 比例: 1 : 1
# SLO 比例: 7 : 12 (严格 vs 宽松)
