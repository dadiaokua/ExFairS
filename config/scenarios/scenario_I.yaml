# =============================================================================
# Scenario I: Balanced Load（平衡负载场景）
# =============================================================================
# 实验数据: 短请求~17-19s, 长请求~13-15s
# 场景特点: 4个客户端，负载均衡，SLO差异化
# SLO设置: 围绕实际延迟设置，让部分请求满足、部分不满足
#   - 短请求: 18s/22s (一个紧一个松)
#   - 长请求: 15s/20s (一个紧一个松)
# 负载: 150% (原128 -> 192)
# =============================================================================

name: "Scenario_I_Balanced_Load"
description: "Balanced load with differentiated SLO (150% load)"

clients:
  short:
    count: 2
    qpm: [42, 54]           # 原 28, 36 * 1.5
    qpm_ratio: 1
    slo: [18, 22]           # 一个紧(50%违约)，一个松(几乎不违约)
  
  long:
    count: 2
    qpm: [42, 54]           # 原 28, 36 * 1.5
    qpm_ratio: 1
    slo: [15, 20]           # 一个紧(可能违约)，一个松(不违约)
  
  mix:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []

# 总QPM: 192 (原128 * 1.5)
