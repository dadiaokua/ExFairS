# =============================================================================
# Scenario I: 4 Clients - QPM差异化，SLO全部可达
# =============================================================================
# 客户端: 4 Mix
# QPM: 50, 60, 65, 75 (总250，约系统吞吐量143的1.75倍)
# SLO: 8s (统一，宽松，全部可达)
# 总 QPM: 250
# =============================================================================

name: "Scenario_I_4Clients_AllSLOAchievable"
description: "4 Clients with varied QPM (max 1.5x difference), all SLO achievable"

# 覆盖基础配置
experiment:
  request_timeout: 15
  max_output_tokens: 128

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 50
    slo: 8
  - type: Mix
    count: 1
    qpm: 60
    slo: 8
  - type: Mix
    count: 1
    qpm: 65
    slo: 8
  - type: Mix
    count: 1
    qpm: 75
    slo: 8

# 总 QPM: 250 (约系统吞吐量143的1.75倍)
# SLO 8s = 推理时间3s + 排队缓冲5s
