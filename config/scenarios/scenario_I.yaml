# =============================================================================
# Scenario I: Mix 2 Clients - QPM不均匀分布
# =============================================================================
# 客户端: 2 Mix
# QPM: 30, 90 (不均匀分布，3倍差异)
# SLO: 16s (统一)
# 总 QPM: 120
# =============================================================================

name: "Scenario_I_Mix2_Imbalanced"
description: "Mix 2 Clients with imbalanced QPM (30 vs 90)"

# 覆盖基础配置
experiment:
  request_timeout: 20
  max_output_tokens: 512

# 客户端配置 - 实时监控模式使用此格式
clients:
  - type: Mix
    count: 1
    qpm: 30
    slo: 16
  - type: Mix
    count: 1
    qpm: 90
    slo: 16

# 总 QPM: 120
