# =============================================================================
# Scenario I: Mix 2 Clients - QPM不均匀分布
# =============================================================================
# 客户端: 2 Mix
# QPM: 50, 150 (不均匀分布，3倍差异)
# SLO: 10s (统一)
# 总 QPM: 200
# =============================================================================

name: "Scenario_I_Mix2_Imbalanced"
description: "Mix 2 Clients with imbalanced QPM (50 vs 150)"

# 覆盖基础配置
experiment:
  request_timeout: 12
  max_output_tokens: 512

# 客户端配置 - 实时监控模式使用此格式
clients:
  - type: Mix
    count: 1
    qpm: 50
    slo: 10
  - type: Mix
    count: 1
    qpm: 150
    slo: 10

# 总 QPM: 200
