# =============================================================================
# 基础实验配置 (Base Configuration) - 实时监控模式
# =============================================================================
# 所有场景共用的默认配置，各场景文件会自动继承这些设置。
# 实时监控模式：只做一轮，持续时间长，后台每隔一段时间收集数据并调整优先级
# =============================================================================

# -----------------------------------------------------------------------------
# 实验配置 (Experiment Configuration)
# -----------------------------------------------------------------------------
experiment:
  # request_timeout: 单个请求的超时时间（秒）
  # - 超时后请求会被标记为失败
  # - 注意：应该大于SLO阈值，否则请求可能在完成前就被超时
  request_timeout: 30

  # max_output_tokens: 最大输出token数
  max_output_tokens: 512

  # concurrency: 每个客户端的并发数
  concurrency: 10

# -----------------------------------------------------------------------------
# QPM 动态变化配置 (Dynamic QPM Configuration)
# -----------------------------------------------------------------------------
# qpm_variation: QPM 的随机波动范围（0-1之间的比例）
# - 0: 无波动，QPM 固定
# - 0.3: QPM 在 ±30% 范围内随机波动
qpm_variation: 0.3

# qpm_pattern: QPM 变化模式
# - "random": 随机波动
# - "burst": 周期性突发
# - "ramp": 逐渐增加负载
# - "wave": 正弦波形式变化
qpm_pattern: "random"

# burst_interval: 突发间隔（仅当 qpm_pattern="burst" 时有效）
burst_interval: 3

# burst_multiplier: 突发时的 QPM 倍数
burst_multiplier: 2.0

# -----------------------------------------------------------------------------
# 分布配置 (Distribution Configuration)
# -----------------------------------------------------------------------------
# distribution: 请求间隔时间的分布类型
# - "normal": 正态分布，模拟真实用户请求模式
# - "poisson": 泊松分布，随机突发请求
distribution: "poisson"
