# =============================================================================
# Scenario II: High Contention（高竞争场景）
# =============================================================================
# 场景特点: 全部客户端SLO紧张，测试高压下的公平性
# SLO设置: 设置在实际延迟上方，但仍有挑战性
#   - 短请求: 23s/25s (给予适当余量)
#   - 长请求: 19s/21s (给予适当余量)
# 负载: ~70 QPM
# =============================================================================

name: "Scenario_II_High_Contention"
description: "High contention with tight SLO for all clients (~70 QPM)"

clients:
  short:
    count: 2
    qpm: [17, 18]
    qpm_ratio: 1
    slo: [23, 25]           # 从 20/22 提升，给予余量
  
  long:
    count: 2
    qpm: [17, 18]
    qpm_ratio: 1
    slo: [19, 21]           # 从 17/18 提升，给予余量
  
  mix:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []

# 总QPM: 70
