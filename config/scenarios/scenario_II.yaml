# =============================================================================
# Scenario II: Mix 2 Clients - SLO不均匀分布
# =============================================================================
# 客户端: 2 Mix
# QPM: 40, 40 (均匀分布)
# SLO: 15s, 20s (不均匀分布)
# 总 QPM: 80
# =============================================================================

name: "Scenario_II_Mix2_SLO_Imbalanced"
description: "Mix 2 Clients with imbalanced SLO (15s vs 20s)"

# 覆盖基础配置
experiment:
  request_timeout: 25
  max_output_tokens: 512

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 40
    slo: 15
  - type: Mix
    count: 1
    qpm: 40
    slo: 20

# 总 QPM: 80
