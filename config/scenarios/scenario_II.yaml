# =============================================================================
# Scenario II: 三客户端梯度
# =============================================================================
# 模拟：3个客户端，QPM和SLO呈梯度分布
# 特点：小流量严格SLO vs 大流量宽松SLO
# 总 QPM: 300
# =============================================================================

name: "Scenario_II_Triple_Gradient"
description: "3 clients with gradient QPM and SLO distribution"

# experiment 配置统一在 config/Config.py 中

clients:
  - type: Realtime
    count: 1
    qpm: 80
    slo: 6
    # 高优先级：小流量，严格SLO
  - type: Mix
    count: 1
    qpm: 100
    slo: 9
    # 中优先级：中等流量，中等SLO
  - type: Batch
    count: 1
    qpm: 120
    slo: 12
    # 低优先级：大流量，宽松SLO

# 总 QPM: 80 + 100 + 120 = 300
# QPM 比例: 26.7% : 33.3% : 40%
# SLO 比例: 6 : 9 : 12 (梯度分布)
