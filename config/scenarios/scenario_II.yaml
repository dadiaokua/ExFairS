# =============================================================================
# Scenario II (Data2): Mix 2 Clients (QPM=40均匀, SLO差异) & ♣️
# =============================================================================
# 配置: Mix 2 Clients (QPM均匀，SLO差异)
# 描述: 混合请求客户端，QPM相同但SLO不同
# 客户端: 2 Mix (mix_0, mix_1)
# QPM: 40, 40 (均匀分布)
# SLO: 15s, 20s (SLO差异)
# 请求超时: 20s
# 最大输出Token: 256
# 总 QPM: 80
# =============================================================================

name: "Scenario_II_Mix2_SLO_Diff"
description: "Mix 2 Clients (QPM=40 uniform, SLO=15-20) ♣️"

# 覆盖基础配置
experiment:
  request_timeout: 20
  max_output_tokens: 256

clients:
  short:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []
  
  long:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []
  
  mix:
    count: 2
    qpm: [40, 40]
    qpm_ratio: 1
    slo: [15, 20]

# 总QPM: 80
