# =============================================================================
# Scenario II: Mix 2 Clients - SLO不均匀分布
# =============================================================================
# 客户端: 2 Mix
# QPM: 75, 75 (均匀分布)
# SLO: 12s, 16s (不均匀分布，原15s/20s的80%)
# 总 QPM: 150
# =============================================================================

name: "Scenario_II_Mix2_SLO_Imbalanced"
description: "Mix 2 Clients with imbalanced SLO (12s vs 16s)"

# 覆盖基础配置
experiment:
  request_timeout: 20
  max_output_tokens: 512

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 75
    slo: 12
  - type: Mix
    count: 1
    qpm: 75
    slo: 16

# 总 QPM: 150
