# =============================================================================
# Scenario II: 4 Clients - QPM差异化，半数SLO紧张
# =============================================================================
# 客户端: 4 Mix
# QPM: 50, 60, 65, 75 (总250，约系统吞吐量143的1.75倍)
# SLO: 5s (紧张) vs 8s (宽松)
# 总 QPM: 250
# =============================================================================

name: "Scenario_II_4Clients_HalfTightSLO"
description: "4 Clients with varied QPM, half with tight SLO (5s), half with relaxed SLO (8s)"

# 覆盖基础配置
experiment:
  request_timeout: 15
  max_output_tokens: 128

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 50
    slo: 5       # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 60
    slo: 5       # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 65
    slo: 8       # 宽松 SLO
  - type: Mix
    count: 1
    qpm: 75
    slo: 8       # 宽松 SLO

# 总 QPM: 250 (约系统吞吐量143的1.75倍)
# SLO 5s = 推理时间3s + 排队缓冲2s，较紧张
# SLO 8s = 推理时间3s + 排队缓冲5s，宽松
