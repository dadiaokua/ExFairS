# =============================================================================
# Scenario II: 4 Clients - QPM差异化，半数SLO紧张
# =============================================================================
# 客户端: 4 Mix
# QPM: 20, 26, 28, 30 (原80 * 1.3 = 104，差异不超过2倍)
# SLO: 13s (紧张) vs 16s (宽松)
# 总 QPM: 104
# =============================================================================

name: "Scenario_II_4Clients_HalfTightSLO"
description: "4 Clients with varied QPM, half with tight SLO (13s), half with relaxed SLO (16s)"

# 覆盖基础配置
experiment:
  request_timeout: 20
  max_output_tokens: 128

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 20
    slo: 13      # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 26
    slo: 13      # 紧张 SLO
  - type: Mix
    count: 1
    qpm: 28
    slo: 16      # 宽松 SLO
  - type: Mix
    count: 1
    qpm: 30
    slo: 16      # 宽松 SLO

# 总 QPM: 104 (原80 * 1.3)
# SLO 13s = 推理时间3-4s + 排队缓冲9-10s，较紧张
# SLO 16s = 推理时间3-4s + 排队缓冲12-13s，宽松可达
