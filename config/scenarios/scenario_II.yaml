# =============================================================================
# Scenario II: Mix 2 Clients - SLO不均匀分布
# =============================================================================
# 客户端: 2 Mix
# QPM: 40, 40 (均匀分布)
# SLO: 13s, 17s (不均匀分布)
# 总 QPM: 80
# =============================================================================

name: "Scenario_II_Mix2_SLO_Imbalanced"
description: "Mix 2 Clients with imbalanced SLO (8s vs 12s)"

# 覆盖基础配置
experiment:
  request_timeout: 20
  max_output_tokens: 512

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 40
    slo: 13
  - type: Mix
    count: 1
    qpm: 40
    slo: 17

# 总 QPM: 80
