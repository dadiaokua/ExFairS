# =============================================================================
# Scenario IV: Short-Long-Mix Hybrid（短长混合场景）
# =============================================================================
# 场景特点: 10个用户，三种类型混合，形成多维度差异化
# SLO设置: 
#   - 短请求: 22s/25s/28s (原15/17/19 * 1.5)
#   - 长请求: 19s/21s/24s/27s (原13/14/16/18 * 1.5)
#   - Mix请求: 27s/30s/33s (原18/20/22 * 1.5)
# 负载: ~70 QPM
# =============================================================================

name: "Scenario_IV_Short_Long_Mix_Hybrid"
description: "Heterogeneous workload with 10 users: short, long, and mix (~70 QPM)"

clients:
  short:
    count: 3
    qpm: [7, 7, 7]          # 短请求用户
    qpm_ratio: 1
    slo: [22, 25, 28]       # 原来 15/17/19 * 1.5
  
  long:
    count: 4
    qpm: [7, 7, 7, 7]       # 长请求用户
    qpm_ratio: 1
    slo: [19, 21, 24, 27]   # 原来 13/14/16/18 * 1.5
  
  mix:
    count: 3
    qpm: [7, 7, 7]          # Mix用户
    qpm_ratio: 1
    slo: [27, 30, 33]       # 原来 18/20/22 * 1.5

# 总QPM: 70 (10个用户 * 7 QPM)
