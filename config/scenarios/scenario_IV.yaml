# =============================================================================
# Scenario IV: Bursty vs Steady（突发vs稳定场景）
# =============================================================================
# 实验数据: mix类型平均~14-16s
# 场景特点: 极端负载差异(8 vs 24 QPM)，测试突发流量处理
# SLO设置: 低负载用户期望快速响应，高负载用户容忍更长延迟
#   - 低负载(8QPM): 14s/15s (期望快速)
#   - 高负载(24QPM): 18s/20s (允许更长)
# =============================================================================

name: "Scenario_IV_Bursty_Steady"
description: "Bursty vs Steady: low QPM expects fast, high QPM tolerates delay"

clients:
  short:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []
  
  long:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []
  
  mix:
    count: 8
    qpm: [8, 8, 8, 8, 24, 24, 24, 24]
    qpm_ratio: 1
    slo: [14, 14, 15, 15, 18, 18, 20, 20]

# 总QPM: 128
