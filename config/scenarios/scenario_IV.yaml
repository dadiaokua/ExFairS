# =============================================================================
# Scenario IV: SLO梯度 + 动态负载
# =============================================================================
# 模拟：不同优先级的服务，SLO从紧到松
# 特点：负载波动 + SLO差异，考验动态适应能力
# 基础 QPM: 300，峰值可达 ~390
# =============================================================================

name: "Scenario_IV_SLO_Gradient_Dynamic"
description: "Gradient SLO with dynamic load - tests adaptability"

experiment:
  request_timeout: 30
  max_output_tokens: 128

# 大幅度QPM浮动
qpm_variation: 0.3           # ±30% 浮动
qpm_pattern: "random"
max_total_qpm: 400

clients:
  # 紧急服务：SLO紧张
  - type: Mix
    count: 1
    qpm: 50
    slo: 6
  # 重要服务：SLO适中
  - type: Mix
    count: 1
    qpm: 75
    slo: 8
  # 普通服务：SLO宽松
  - type: Mix
    count: 1
    qpm: 90
    slo: 11
  # 后台服务：SLO很宽松
  - type: Mix
    count: 1
    qpm: 85
    slo: 16

# 总 QPM: 50 + 75 + 90 + 85 = 300
# SLO 梯度: 6s → 8s → 11s → 16s
# 挑战：在负载突增时，优先保护紧急服务的SLO
