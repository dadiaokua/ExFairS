# =============================================================================
# Scenario IV: 6 Clients - QPM动态浮动，SLO全部可达
# =============================================================================
# 客户端: 6 Mix
# 基础 QPM: 10, 12, 13, 14, 15, 16 (总计 80)
# QPM 浮动: ±50% (random 模式)
# SLO: 20s (统一，宽松，全部可达)
# =============================================================================

name: "Scenario_IV_6Clients_AllSLO_DynamicQPM"
description: "6 Clients with dynamic QPM (±50% fluctuation), all SLO achievable (20s)"

# 覆盖基础配置
experiment:
  request_timeout: 25
  max_output_tokens: 512

# QPM 动态浮动配置（全局）
qpm_variation: 0.5           # ±50% 浮动
qpm_pattern: "random"        # 随机浮动模式
max_total_qpm: 100           # 总 QPM 上限（协调机制确保不超过此值）

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 10
    slo: 20
  - type: Mix
    count: 1
    qpm: 12
    slo: 20
  - type: Mix
    count: 1
    qpm: 13
    slo: 20
  - type: Mix
    count: 1
    qpm: 14
    slo: 20
  - type: Mix
    count: 1
    qpm: 15
    slo: 20
  - type: Mix
    count: 1
    qpm: 16
    slo: 20

# 基础总 QPM: 80
# 最大可能 QPM (全部上浮 50%): 120
# 但由于 random 模式是随机浮动，实际总 QPM 会在 40-120 之间波动
# SLO 20s = 推理时间12.5s + 排队缓冲7.5s，全部可达
