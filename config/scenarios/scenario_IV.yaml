# =============================================================================
# Scenario IV: 4 Clients - QPM动态浮动，SLO递增分布
# =============================================================================
# 客户端: 4 Mix
# QPM: 50, 60, 65, 75 (基础值，总250)
# QPM 浮动: ±30% (random 模式)
# SLO: 5s, 6s, 7s, 8s (递增分布)
# 总 QPM: 250 (基础)
# =============================================================================

name: "Scenario_IV_4Clients_DynamicQPM_GradientSLO"
description: "4 Clients with dynamic QPM (±30%), gradient SLO (5-8s)"

# 覆盖基础配置
experiment:
  request_timeout: 15
  max_output_tokens: 128

# QPM 动态浮动配置
qpm_variation: 0.3           # ±30% 浮动
qpm_pattern: "random"        # 随机浮动模式
max_total_qpm: 350           # 总 QPM 上限 (250 * 1.3 ≈ 325，留点余量)

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 50
    slo: 5       # 较紧张
  - type: Mix
    count: 1
    qpm: 60
    slo: 6       # 稍紧张
  - type: Mix
    count: 1
    qpm: 65
    slo: 7       # 适中
  - type: Mix
    count: 1
    qpm: 75
    slo: 8       # 宽松

# 基础总 QPM: 250
# 实际 QPM 会在 175-325 之间浮动 (250 * 0.7 ~ 250 * 1.3)
# SLO 递增: 5s, 6s, 7s, 8s
