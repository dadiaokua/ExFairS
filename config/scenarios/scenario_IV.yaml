# =============================================================================
# Scenario IV: Mix 4 Clients - SLO递增分布
# =============================================================================
# 客户端: 4 Mix
# QPM: 20 (均匀分布)
# SLO: 10s, 12s, 15s, 20s (递增分布)
# 总 QPM: 80
# =============================================================================

name: "Scenario_IV_Mix4_SLO_Gradient"
description: "Mix 4 Clients with gradient SLO (10-20s)"

# 覆盖基础配置
experiment:
  request_timeout: 25
  max_output_tokens: 512

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 20
    slo: 10
  - type: Mix
    count: 1
    qpm: 20
    slo: 12
  - type: Mix
    count: 1
    qpm: 20
    slo: 15
  - type: Mix
    count: 1
    qpm: 20
    slo: 20

# 总 QPM: 80
