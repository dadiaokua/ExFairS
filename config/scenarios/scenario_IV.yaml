# =============================================================================
# Scenario IV: Mix 4 Clients - SLO递增分布
# =============================================================================
# 客户端: 4 Mix
# QPM: 20, 20, 20, 20 (均匀分布)
# SLO: 13s, 15s, 17s, 19s (递增分布)
# 总 QPM: 80
# =============================================================================

name: "Scenario_IV_Mix4_SLO_Gradient"
description: "Mix 4 Clients with gradient SLO (6-12s)"

# 覆盖基础配置
experiment:
  request_timeout: 20
  max_output_tokens: 512

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 20
    slo: 13
  - type: Mix
    count: 1
    qpm: 20
    slo: 15
  - type: Mix
    count: 1
    qpm: 20
    slo: 17
  - type: Mix
    count: 1
    qpm: 20
    slo: 19

# 总 QPM: 80
