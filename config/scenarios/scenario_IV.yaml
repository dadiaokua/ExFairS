# =============================================================================
# Scenario IV: 实时型 vs 批处理型
# =============================================================================
# 模拟：2组客户端，实时型（严格SLO）vs 批处理型（宽松SLO）
# 特点：测试ExFairS在异构工作负载下的表现
# 总 QPM: 290
# =============================================================================

name: "Scenario_IV_Realtime_vs_Batch"
description: "Realtime clients vs Batch clients with different SLO requirements"

# experiment 配置统一在 config/Config.py 中

clients:
  - type: Realtime
    count: 1
    qpm: 55
    slo: 6
    # 实时型A：严格SLO
  - type: Realtime
    count: 1
    qpm: 55
    slo: 6
    # 实时型B：严格SLO
  - type: Batch
    count: 1
    qpm: 90
    slo: 14
    # 批处理型A：宽松SLO
  - type: Batch
    count: 1
    qpm: 90
    slo: 14
    # 批处理型B：宽松SLO

# 总 QPM: 55 × 2 + 90 × 2 = 290
# QPM 比例: 19% : 19% : 31% : 31%
# SLO 比例: 6 : 6 : 14 : 14 (实时 vs 批处理)
