# =============================================================================
# Scenario III: SLO两极分化 - 实时 vs 批量
# =============================================================================
# 模拟：实时对话服务（低延迟）vs 后台批量任务（延迟不敏感）
# 特点：极端的SLO差异，考验SLO感知调度
# 总 QPM: 350 (原320 + 30)
# =============================================================================

name: "Scenario_III_Realtime_vs_Batch"
description: "Realtime services (strict SLO) vs batch jobs (relaxed SLO)"

experiment:
  request_timeout: 20
  max_output_tokens: 128

clients:
  # 实时服务：低QPM，紧张SLO
  - type: Mix
    count: 1
    qpm: 45        # (原40+5)
    slo: 5         # 紧张
  - type: Mix
    count: 1
    qpm: 65        # (原60+5)
    slo: 5
  # 批量任务：高QPM，宽松SLO
  - type: Mix
    count: 1
    qpm: 120       # (原110+10)
    slo: 18        # 非常宽松
  - type: Mix
    count: 1
    qpm: 120       # (原110+10)
    slo: 18

# SLO 比例: 1 : 1 : 3.6 : 3.6
# 挑战：实时服务的请求必须优先处理，即使批量任务的QPM更高
