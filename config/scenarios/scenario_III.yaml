# =============================================================================
# Scenario III: Mix 4 Clients - QPM递增分布
# =============================================================================
# 客户端: 4 Mix
# QPM: 20, 28, 32, 40 (递增分布，2倍差异)
# SLO: 12s (统一)
# 总 QPM: 120
# =============================================================================

name: "Scenario_III_Mix4_QPM_Gradient"
description: "Mix 4 Clients with gradient QPM (20-40)"

# 覆盖基础配置
experiment:
  request_timeout: 16
  max_output_tokens: 512

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 20
    slo: 12
  - type: Mix
    count: 1
    qpm: 28
    slo: 12
  - type: Mix
    count: 1
    qpm: 32
    slo: 12
  - type: Mix
    count: 1
    qpm: 40
    slo: 12

# 总 QPM: 120
