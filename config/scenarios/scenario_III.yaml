# =============================================================================
# Scenario III: Mix 4 Clients - QPM递增分布
# =============================================================================
# 客户端: 4 Mix
# QPM: 30, 45, 55, 70 (递增分布，约2.3倍差异)
# SLO: 9s (统一)
# 总 QPM: 200
# =============================================================================

name: "Scenario_III_Mix4_QPM_Gradient"
description: "Mix 4 Clients with gradient QPM (30-70)"

# 覆盖基础配置
experiment:
  request_timeout: 12
  max_output_tokens: 512

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 30
    slo: 9
  - type: Mix
    count: 1
    qpm: 45
    slo: 9
  - type: Mix
    count: 1
    qpm: 55
    slo: 9
  - type: Mix
    count: 1
    qpm: 70
    slo: 9

# 总 QPM: 200
