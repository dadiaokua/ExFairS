# =============================================================================
# Scenario III: Mix 4 Clients - QPM递增分布
# =============================================================================
# 客户端: 4 Mix
# QPM: 15, 20, 25, 30 (递增分布)
# SLO: 15s (统一)
# 总 QPM: 90
# =============================================================================

name: "Scenario_III_Mix4_QPM_Gradient"
description: "Mix 4 Clients with gradient QPM (15-30)"

# 覆盖基础配置
experiment:
  request_timeout: 20
  max_output_tokens: 512

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 15
    slo: 15
  - type: Mix
    count: 1
    qpm: 20
    slo: 15
  - type: Mix
    count: 1
    qpm: 25
    slo: 15
  - type: Mix
    count: 1
    qpm: 30
    slo: 15

# 总 QPM: 90
