# =============================================================================
# Scenario III: 4 Clients - QPM差异化，SLO全部紧张
# =============================================================================
# 客户端: 4 Mix
# QPM: 15, 20, 22, 23 (差异不超过2倍)
# SLO: 15s, 16s, 16s, 17s (全部紧张)
# 总 QPM: 80
# =============================================================================

name: "Scenario_III_4Clients_AllTightSLO"
description: "4 Clients with varied QPM, all with tight SLO (15-17s)"

# 覆盖基础配置
experiment:
  request_timeout: 25
  max_output_tokens: 512

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 15
    slo: 15      # 非常紧张
  - type: Mix
    count: 1
    qpm: 20
    slo: 16      # 紧张
  - type: Mix
    count: 1
    qpm: 22
    slo: 16      # 紧张
  - type: Mix
    count: 1
    qpm: 23
    slo: 17      # 稍紧张

# 总 QPM: 80
# 所有 SLO 都比较紧张，考验调度策略的能力
