# =============================================================================
# Scenario III: Asymmetric Load（非对称负载场景）
# =============================================================================
# 实验数据: 短请求~17-19s, 长请求~13-15s
# 场景特点: 2短+4长，长请求主导，负载不均衡
# SLO设置: 
#   - 短请求: 19s/21s (给少数派稍宽松的SLO)
#   - 长请求: 14s/15s/16s/18s (渐变SLO)
# 负载: 120% (原150% * 0.8)
# =============================================================================

name: "Scenario_III_Asymmetric_Load"
description: "Asymmetric load: 2 short + 4 long with varied SLO (120% load)"

clients:
  short:
    count: 2
    qpm: [24, 29]           # 原30, 36 * 0.8
    qpm_ratio: 1
    slo: [19, 21]           # 稍宽松
  
  long:
    count: 4
    qpm: [24, 24, 26, 26]   # 原30, 30, 33, 33 * 0.8
    qpm_ratio: 1
    slo: [14, 15, 16, 18]   # 渐变SLO
  
  mix:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []

# 总QPM: 153 (原192 * 0.8)
