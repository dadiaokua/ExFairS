# =============================================================================
# Scenario III: Asymmetric Load（非对称负载场景）
# =============================================================================
# 实验数据: 短请求~17-19s, 长请求~13-15s
# 场景特点: 2短+4长，长请求主导，负载不均衡
# SLO设置: 
#   - 短请求: 19s/21s (给少数派稍宽松的SLO)
#   - 长请求: 14s/15s/16s/18s (渐变SLO)
# 负载: ~100 QPM
# =============================================================================

name: "Scenario_III_Asymmetric_Load"
description: "Asymmetric load: 2 short + 4 long with varied SLO (~100 QPM)"

clients:
  short:
    count: 2
    qpm: [15, 18]           # 短请求用户
    qpm_ratio: 1
    slo: [19, 21]           # 稍宽松
  
  long:
    count: 4
    qpm: [16, 16, 17, 17]   # 长请求用户
    qpm_ratio: 1
    slo: [14, 15, 16, 18]   # 渐变SLO
  
  mix:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []

# 总QPM: 99
