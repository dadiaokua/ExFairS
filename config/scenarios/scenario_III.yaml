# =============================================================================
# Scenario III: SLO两极分化 - 实时 vs 批量
# =============================================================================
# 模拟：实时对话服务（低延迟）vs 后台批量任务（延迟不敏感）
# 特点：极端的SLO差异，考验SLO感知调度
# 总 QPM: 300
# =============================================================================

name: "Scenario_III_Realtime_vs_Batch"
description: "Realtime services (strict SLO) vs batch jobs (relaxed SLO)"

experiment:
  request_timeout: 30
  max_output_tokens: 128

clients:
  # 实时服务：低QPM，紧张SLO
  - type: Mix
    count: 1
    qpm: 40
    slo: 6         # 紧张
  - type: Mix
    count: 1
    qpm: 55
    slo: 6
  # 批量任务：高QPM，宽松SLO
  - type: Mix
    count: 1
    qpm: 105
    slo: 19        # 非常宽松
  - type: Mix
    count: 1
    qpm: 100
    slo: 19

# 总 QPM: 40 + 55 + 105 + 100 = 300
# SLO 比例: 1 : 1 : 3.2 : 3.2
# 挑战：实时服务的请求必须优先处理，即使批量任务的QPM更高
