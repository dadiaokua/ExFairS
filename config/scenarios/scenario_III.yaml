# =============================================================================
# Scenario III: Asymmetric Load（非对称负载场景）
# =============================================================================
# 场景特点: 2短+4长，长请求主导，负载不均衡
# SLO设置: 
#   - 短请求: 28s/31s (原19/21 * 1.5)
#   - 长请求: 21s/22s/24s/27s (原14/15/16/18 * 1.5)
# 负载: ~70 QPM
# =============================================================================

name: "Scenario_III_Asymmetric_Load"
description: "Asymmetric load: 2 short + 4 long with varied SLO (~70 QPM)"

clients:
  short:
    count: 2
    qpm: [10, 13]           # 短请求用户
    qpm_ratio: 1
    slo: [28, 31]           # 原来 19/21 * 1.5
  
  long:
    count: 4
    qpm: [12, 12, 12, 11]   # 长请求用户
    qpm_ratio: 1
    slo: [21, 22, 24, 27]   # 原来 14/15/16/18 * 1.5
  
  mix:
    count: 0
    qpm: []
    qpm_ratio: 1
    slo: []

# 总QPM: 70 (10+13+12+12+12+11)
