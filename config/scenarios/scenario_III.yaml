# =============================================================================
# Scenario III: 4 Clients - QPM差异化，SLO全部紧张
# =============================================================================
# 客户端: 4 Mix
# QPM: 50, 60, 65, 75 (总250，约系统吞吐量143的1.75倍)
# SLO: 4.5s, 5s, 5.5s, 6s (全部紧张)
# 总 QPM: 250
# =============================================================================

name: "Scenario_III_4Clients_AllTightSLO"
description: "4 Clients with varied QPM, all with tight SLO (4.5-6s)"

# 覆盖基础配置
experiment:
  request_timeout: 15
  max_output_tokens: 128

# 客户端配置
clients:
  - type: Mix
    count: 1
    qpm: 50
    slo: 4.5     # 非常紧张
  - type: Mix
    count: 1
    qpm: 60
    slo: 5       # 紧张
  - type: Mix
    count: 1
    qpm: 65
    slo: 5.5     # 紧张
  - type: Mix
    count: 1
    qpm: 75
    slo: 6       # 稍紧张

# 总 QPM: 250 (约系统吞吐量143的1.75倍)
# 所有 SLO 都比较紧张，考验调度策略的能力
